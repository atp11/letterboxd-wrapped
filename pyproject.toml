[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "letterboxd-wrapped"
version = "1.0.0"
description = "Análisis tipo Wrapped a partir de una exportación de Letterboxd"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "plotly>=5.18",
  "jinja2>=3.1",
  "requests>=2.31",
  "tqdm>=4.66",
  "rapidfuzz>=3.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
letterboxd-wrapped = "letterboxd_wrapped.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
